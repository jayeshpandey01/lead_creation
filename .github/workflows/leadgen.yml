name: Lead generation

on:
  workflow_dispatch:
  schedule:
    # Run every 5 minutes
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: leadgen-production
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STORAGE_BACKEND: firestore
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'leadgendb-eb134' }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIRESTORE_LEADS_COLLECTION: leads
      MAPS_SCRAPER_URL: http://127.0.0.1:8080
      MAPS_CSV_PATH: leads_input.csv
      LEADS_EXPORT_CSV_PATH: leads_output.csv
      QUERIES_FILE: queries.txt
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: openai/gpt-4o-mini
      MAIL_PROVIDER: ${{ vars.MAIL_PROVIDER || 'smtp' }}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USE_TLS: "true"
      SMTP_FROM_EMAIL: ${{ vars.SMTP_FROM_EMAIL || 'copys.client@gmail.com' }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || 'osbf zpvx wxpo dyjn' }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL || 'copys.client@gmail.com' }}
      RESEND_REPLY_TO: ${{ vars.RESEND_REPLY_TO || 'copys.client@gmail.com' }}
      SENDER_NAME: ${{ vars.SENDER_NAME || 'Jayesh Pandey' }}
      SENDER_COMPANY: ${{ vars.SENDER_COMPANY || 'Copys' }}
      SENDER_ADDRESS: ${{ vars.SENDER_ADDRESS || 'Mumbai, India' }}
      ENABLE_EMAIL_SENDING: ${{ vars.ENABLE_EMAIL_SENDING || 'true' }}
      JOB_SEND_LIMIT: "1"
      SEND_DAILY_CAP: "100"
      DISCOVERY_BATCH_SIZE: "1"
      SENDER_TIMEZONE: Asia/Kolkata
      SENDING_HOUR_START: "0"
      SENDING_HOUR_END: "24"
      SENDING_WEEKDAYS_ONLY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application
        run: pip install --no-cache-dir -e . beautifulsoup4

      - name: Check required configuration
        run: |
          python - <<'PY'
          import json
          import os

          required = ["FIREBASE_SERVICE_ACCOUNT_JSON", "OPENROUTER_API_KEY"]
          if os.environ.get("ENABLE_EMAIL_SENDING", "false").lower() == "true":
              provider = os.environ.get("MAIL_PROVIDER", "smtp").lower()
              if provider == "resend":
                  required += ["RESEND_API_KEY", "RESEND_FROM_EMAIL"]
              elif provider == "smtp":
                  required += ["SMTP_FROM_EMAIL", "SMTP_PASSWORD"]
              required += ["SENDER_NAME", "SENDER_COMPANY", "SENDER_ADDRESS"]
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              raise SystemExit("Configure these GitHub Actions secrets/variables: " + ", ".join(missing))

          credential_json = os.environ["FIREBASE_SERVICE_ACCOUNT_JSON"].strip()
          if len(credential_json) >= 2 and credential_json[0] == credential_json[-1] == "'":
              credential_json = credential_json[1:-1]
          try:
              credential = json.loads(credential_json)
          except json.JSONDecodeError as exc:
              raise SystemExit("FIREBASE_SERVICE_ACCOUNT_JSON must contain valid raw JSON") from exc
          for field in ("project_id", "client_email", "private_key"):
              if not credential.get(field):
                  raise SystemExit(f"Firebase service-account JSON is missing {field}")
          configured_project = os.environ.get("FIREBASE_PROJECT_ID", "").strip()
          if configured_project and configured_project != credential["project_id"]:
              raise SystemExit("FIREBASE_PROJECT_ID does not match the service-account JSON")
          PY

      - name: Start Maps scraper
        run: |
          docker run -d --name leadgen-maps-scraper -p 8080:8080 \
            -v "$RUNNER_TEMP/maps-data:/gmapsdata" \
            gosom/google-maps-scraper \
            -web -addr :8080 -data-folder /gmapsdata \
            -c 1 -browser-pool-size 1 -pages-per-browser 1

      - name: Wait for Maps scraper
        run: |
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          url = "http://127.0.0.1:8080/api/v1/jobs"
          deadline = time.monotonic() + 90
          last_error = None
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      if 200 <= response.status < 300:
                          print("Maps scraper is ready")
                          break
              except (OSError, urllib.error.URLError) as exc:
                  last_error = exc
              time.sleep(1)
          else:
              raise SystemExit(f"Maps scraper failed to start: {last_error}")
          PY

      - name: Run one bounded pipeline cycle
        run: python -m leadgen.pipeline

      - name: Upload CSV snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leads-output-${{ github.run_id }}
          path: leads_output.csv
          if-no-files-found: warn
          retention-days: 14

      - name: Stop scraper
        if: always()
        run: docker rm -f leadgen-maps-scraper || true
