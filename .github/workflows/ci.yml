name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application
        run: python -m pip install --no-cache-dir -e .

      - name: Check Python syntax
        run: python -m compileall -q src

      - name: Check application imports
        run: python -c "import leadgen.pipeline; import leadgen.audit"

      - name: Validate project configuration and lead inputs
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          import yaml

          positioning = yaml.safe_load(Path("config/positioning.yaml").read_text())
          if not isinstance(positioning, dict) or not positioning:
              raise SystemExit("config/positioning.yaml must contain a non-empty YAML mapping")

          queries = [
              line.strip()
              for line in Path("queries.txt").read_text().splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]
          if not queries:
              raise SystemExit("queries.txt must contain at least one search query")

          with Path("leads_input.csv").open(newline="") as source:
              reader = csv.DictReader(source)
              headers = {header.strip().lower() for header in (reader.fieldnames or [])}
          if not {"name", "website"}.issubset(headers):
              raise SystemExit("leads_input.csv must include name and website columns")
          PY
