services:
  - type: web
    name: leadgen
    runtime: python
    plan: starter
    buildCommand: pip install -e .
    startCommand: uvicorn leadgen.dashboard:app --host 0.0.0.0 --port $PORT
    disk:
      # Holds the SQLite leads db so it survives restarts/deploys without a
      # separate managed database service.
      name: leadgen-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/leadgen.db
      - key: LEADS_EXPORT_CSV_PATH
        value: /var/data/leads_output.csv
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: TRIGGER_TOKEN
        sync: false
      - key: MAPS_SCRAPER_URL
        fromService:
          name: maps-scraper
          type: pserv
          property: hostport
      - key: MAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_REPLY_TO
        sync: false
      - key: IMAP_HOST
        value: "imap.gmail.com"
      - key: IMAP_USERNAME
        sync: false
      - key: IMAP_PASSWORD
        sync: false
      - key: SENDER_NAME
        sync: false
      - key: SENDER_COMPANY
        sync: false
      - key: SENDER_ADDRESS
        sync: false
      - key: SEND_DAILY_CAP
        value: "15"
      - key: SEND_BATCH_MIN
        value: "1"
      - key: SEND_BATCH_MAX
        value: "1"
      - key: SEND_INTERVAL_MIN_SECONDS
        value: "120"
      - key: SEND_INTERVAL_MAX_SECONDS
        value: "180"
      - key: SENDER_IDLE_POLL_SECONDS
        value: "60"
      - key: DISCOVERY_BATCH_SIZE
        value: "1"
      - key: PIPELINE_INTERVAL_SECONDS
        value: "180"
      - key: SENDER_TIMEZONE
        value: "Asia/Kolkata"

  # Runs gosom/google-maps-scraper (github.com/gosom/google-maps-scraper) as
  # an internal-only service. No public URL, no API key — the leadgen web
  # service reaches it over Render's private network at MAPS_SCRAPER_URL.
  # NOTE: best-effort config based on the tool's documented CLI flags —
  # not live-verified against a real Render deploy (no Docker available in
  # this dev environment). If the container fails to start, check the
  # startCommand against the image's actual ENTRYPOINT.
  - type: pserv
    name: maps-scraper
    runtime: image
    image:
      url: docker.io/gosom/google-maps-scraper:latest
    plan: starter
    startCommand: "-web -addr :10000 -data-folder /var/data"
    disk:
      name: maps-scraper-state
      mountPath: /var/data
      sizeGB: 1
