services:
  - type: web
    name: lead-creation-tem2
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    disk:
      # Holds the SQLite leads db so it survives restarts/deploys without a
      # separate managed database service.
      name: leadgen-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/leadgen.db
      - key: LEADS_EXPORT_CSV_PATH
        value: /var/data/leads_output.csv
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: TRIGGER_TOKEN
        sync: false
      - key: MAPS_SCRAPER_URL
        value: http://127.0.0.1:8080
      - key: MAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_REPLY_TO
        sync: false
      - key: IMAP_HOST
        value: "imap.gmail.com"
      - key: IMAP_USERNAME
        sync: false
      - key: IMAP_PASSWORD
        sync: false
      - key: SENDER_NAME
        sync: false
      - key: SENDER_COMPANY
        sync: false
      - key: SENDER_ADDRESS
        sync: false
      - key: SEND_DAILY_CAP
        value: "15"
      - key: SEND_BATCH_MIN
        value: "1"
      - key: SEND_BATCH_MAX
        value: "1"
      - key: SEND_INTERVAL_MIN_SECONDS
        value: "120"
      - key: SEND_INTERVAL_MAX_SECONDS
        value: "180"
      - key: SENDER_IDLE_POLL_SECONDS
        value: "60"
      - key: DISCOVERY_BATCH_SIZE
        value: "1"
      - key: PIPELINE_INTERVAL_SECONDS
        value: "180"
      - key: SENDER_TIMEZONE
        value: "Asia/Kolkata"
