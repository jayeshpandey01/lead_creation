[project]
name = "leadgen"
version = "0.1.0"
description = "ICP-based lead discovery, research, and humanized cold-email outreach"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "trafilatura>=1.8",
    "dnspython>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
